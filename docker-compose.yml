version: '3.8'

services:
  # 1. MongoDB Database for Extraction History
  mongo:
    image: mongo:7.0
    container_name: id-extractor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - id-extractor-net

  # 2. Python FastAPI Microservice (OpenCV, Tesseract OCR, Decision Gate, Groq)
  python-service:
    build:
      context: ./python_service
      dockerfile: Dockerfile
    container_name: id-extractor-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    networks:
      - id-extractor-net

  # 3. Express.js API Gateway (Multer, Mongoose persistence, Proxy)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: id-extractor-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/id_document_extractor
      - PYTHON_SERVICE_URL=http://python-service:8000
    depends_on:
      - mongo
      - python-service
    networks:
      - id-extractor-net

  # 4. React Frontend (Vite + Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: id-extractor-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - id-extractor-net

volumes:
  mongo-data:

networks:
  id-extractor-net:
    driver: bridge
